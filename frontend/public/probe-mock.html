<!DOCTYPE html>
<html>
<body>
<script>
const f = document.createElement('iframe');
f.src = '/login';
f.style.cssText = 'width:1440px;height:900px;border:0';
document.body.appendChild(f);

function step(label, fn) {
  try { return fn(); } catch (e) { return 'ERR:' + e.message; }
}

setTimeout(() => {
  // Wait for mock.json to load + demo session to activate.
  const s1 = step('s1', () => {
    const d = f.contentDocument;
    const h1 = d.querySelector('h1');
    return h1 ? h1.textContent : 'no-h1';
  });
  setTimeout(() => {
    const s2 = step('s2', () => {
      const d = f.contentDocument;
      // If the demo session auto-activated, RequireAuth already redirects to /dashboard.
      return d.location.href;
    });
    setTimeout(() => {
      const s3 = step('s3', () => {
        const d = f.contentDocument;
        const h1 = d.querySelector('h1');
        return h1 ? h1.textContent.trim() : 'no-h1';
      });
      document.title = 'MOCKTEST:' + JSON.stringify({ s1, s2, s3 });
    }, 2500);
  }, 2500);
}, 3000);
</script>
</body>
</html>
